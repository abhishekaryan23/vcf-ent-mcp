# ==============================================================================
# Enterprise VCF MCP Control Plane Configuration
# ==============================================================================

# Example configuration. The real file lives at ~/.vcf-mcp/config.yaml (created by `vcf-mcp client-config`
# and filled in by the guided setup, see docs/guided_setup.md); point VCF_ENTERPRISE_MCP_CONFIG at another
# file to use it instead. You normally do not edit this file by hand. Keys marked "not wired" are accepted
# but have no effect yet. Passwords never belong here: only secret references.

server:
  # production_mode: false  # true = strict production (no lab tokens, no loopback targets, no test keys)
  # default_skill: "vcf-oncall-troubleshoot"  # pre-prune tools/list for small models
  host: "127.0.0.1"   # listener of `vcf-mcp server --mode http` (plain HTTP). Without this key the default is 0.0.0.0: set it.
  port: 8443
  mcp_endpoint: "/mcp"
  # enable_tls / cert_path / key_path: not wired. The listener is plain HTTP; terminate TLS in a gateway in front of it.
  mode: "stdio"       # "stdio" (default), or "http" / "remote_gateway" for the HTTP listener; `vcf-mcp server --mode ...` overrides
  # log_level: not wired
  # environment: "production"   # production = real appliances | digital_twin = the simulator | testing = in-memory fixtures

idp:
  enabled: true
  # allow_lab_tokens: true   # LAB ONLY: trust tokens from `vcf-mcp token mint` (issuer urn:vcf-mcp:lab); ignored in production mode
  # Placeholders: set these to your own IdP (the default Entra "common" issuer is refused in production mode).
  provider_name: "corporate-entra-id"
  issuer_url: "https://login.microsoftonline.com/common/v2.0"
  client_id: "vcf-mcp-control-plane-client"
  # jwks_uri: "https://login.microsoftonline.com/common/discovery/v2.0/keys"
  user_claim: "preferred_username"
  groups_claim: "groups"
  roles_claim: "roles"

vcf:
  gateway_url: "http://127.0.0.1:8085"   # the bundled Digital Twin (server.environment: digital_twin); see docs/local_testing.md
  active_version: "9.1.1"
  verify_ssl: true  # Set false explicitly to ignore upstream certificates (warns at startup).
  ca_cert_path: null  # Optional PEM CA bundle for private/enterprise certificates.
  timeout_seconds: 30.0
  sddc_service_user: "svc_vcf_mcp_control_plane"
  credential_ref: "local://env-prod/sddc-service"   # fallback secret reference; add it with `vcf-mcp credentials add --name sddc-service ...`
  # REAL_VCF mode (server.environment: production): set the components you use; every one is optional and tools
  # for unconfigured components are not offered. With none set the server starts in setup mode (guided setup).
  # sddc_manager_url: "https://sddc-manager.example.internal"
  # vcenter_url: "https://vcenter-mgmt.example.internal"
  # nsx_url: "https://nsx-mgmt.example.internal"
  # operations_url: "https://vcf-ops.example.internal"
  # Optional per-component credentials (else credential_ref). Use least-privilege service accounts.
  # component_credential_refs:
  #   vcenter: "cyberark://vcf/svc-mcp-vcenter"
  #   nsx: "cyberark://vcf/svc-mcp-nsx"
  #   vcf_operations: "cyberark://vcf/svc-mcp-ops"
  # operations_auth_source: "vIDMAuthSource"   # VCF Operations authSource for AD / identity-broker users
  # SSRF allowlist for appliance destinations (a list REPLACES the defaults, so include everything you need).
  # allowed_dns_suffixes: [".example.internal"]
  # allowed_cidrs: ["10.0.0.0/8", "192.168.0.0/16"]
  # endpoint_overrides: {"vc-mgmt01.example.internal": "https://203.0.113.10"}   # alias for names that do not resolve
  # CA bundle (ADDED to the system trust store) and an explicit HTTPS proxy (falls back to HTTPS_PROXY / NO_PROXY):
  # ca_cert_path: "/path/to/enterprise-ca-chain.pem"
  # https_proxy: "http://proxy.example.internal:3128"
  # VCF Automation / Orchestrator (experimental): `vcf-mcp setup automation` writes automation_url, automation_org and
  # automation_client_id for you. orchestrator_auth: automation_token (default) | basic | vcfa_session.
  # orchestrator_script_level: es5 (default) | rhino_1_7_15

policy:
  # Setup never leaves DISCOVERY_ONLY (reads only, changes refused); you move to AUDITED_OPERATIONS yourself.
  # Also accepted: FULL_ENFORCEMENT, READ_ONLY, DISABLED (emergency stop).
  operating_mode: "DISCOVERY_ONLY"
  require_approval_for_high_impact: true
  # Not wired (no effect yet): enforce_two_stage_auth, require_approval_for_destructive, allow_dry_run_bypass_approval,
  # max_token_ttl_seconds. Every write needs a dry run and a signed approval regardless.
  enforce_two_stage_auth: true
  require_approval_for_destructive: true
  allow_dry_run_bypass_approval: true
  max_token_ttl_seconds: 3600

audit:
  # The audit chain is always written to the control-plane database (~/.vcf-mcp/control_plane.db).
  # export_target, file_path and export_to_vcf_operations_logs are not wired: nothing is exported to a file or SIEM yet.
  enabled: true
  export_target: "memory"
  file_path: "audit_events.jsonl"
  redact_secrets: true
  export_to_vcf_operations_logs: false
